<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<style>
  :root { --logo: none; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow: hidden; user-select: none;
    font-family: "Segoe UI", system-ui, sans-serif; color: #e8ecef; text-align: center;
    background: radial-gradient(ellipse at 50% 30%, rgba(31,217,121,.14), transparent 65%), #0a0d12;
    border: 1px solid #1b232d;
  }
  .logo { width: 96px; height: 96px; background: var(--logo) center / contain no-repeat; animation: flotar 4s ease-in-out infinite; }
  @keyframes flotar { 50% { transform: translateY(-5px); } }
  h1 { margin: 4px 0 0; font-size: 18px; letter-spacing: .3px; }
  #texto { font-size: 13px; color: #8693a0; min-height: 18px; }
  .barra { width: 280px; height: 6px; border-radius: 99px; background: #151b23; overflow: hidden; }
  #p { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #0e9f52, #1fd979); transition: width .2s; }
  .indef #p { width: 35% !important; animation: ir 1.1s ease-in-out infinite; }
  @keyframes ir { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
</style>
</head>
<body class="indef">
  <div class="logo" aria-hidden="true"></div>
  <h1 id="titulo">Actualizando el launcher</h1>
  <div class="barra"><div id="p"></div></div>
  <div id="texto">Preparando...</div>
<script>
  function setP(n, texto) {
    document.body.classList.toggle('indef', n == null);
    if (n != null) document.getElementById('p').style.width = n + '%';
    if (texto) document.getElementById('texto').textContent = texto;
  }
</script>
</body>
</html>
